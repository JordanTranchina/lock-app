name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Tier 1 — fast checks on every PR: compile, package, lint, unit tests.
  # ---------------------------------------------------------------------------
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The real Satoshi fonts are licensed (Fontshare) and intentionally NOT in
      # the repo (see README). CI substitutes a libre TTF under the expected
      # filenames so the app compiles and runs — the resulting APK is for
      # verification only, not for release.
      - name: Provide placeholder fonts
        run: .github/scripts/placeholder-fonts.sh

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Lint runs but does not gate the build yet: this is the repo's first CI,
      # so the pre-existing lint baseline is unknown. Flip continue-on-error to
      # false (or add a lint baseline) once the report is clean to make it a gate.
      - name: Android Lint
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Tier 2 — prove it actually runs on Android: boot an emulator and run the
  # instrumented tests (Room 4->5 migration + ScheduleDao CRUD on real SQLite).
  # ---------------------------------------------------------------------------
  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [33]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Provide placeholder fonts
        run: .github/scripts/placeholder-fonts.sh

      # Hardware acceleration for the emulator on ubuntu runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: app/build/reports/androidTests
          if-no-files-found: ignore
